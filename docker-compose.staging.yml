# STAGING souply-web → :8086 → souply.manofoto.dpdns.org
# (api.souply.manofoto, souply-api-staging:3002).
#
# Built from the `staging` worktree on OMV. Image tag: souply-web:staging.
# Production-like: NO dev-auth bypass (real OAuth only). VITE_APP_ENV=staging
# drives the amber STAGING banner + [STAGING] title + robots noindex.
#
#   cd /opt/souply-staging/souply-web  # staging worktree
#   docker compose -f docker-compose.staging.yml up -d --build
name: souply-staging
services:
  souply-web-staging:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: https://api.souply.manofoto.dpdns.org
        VITE_GOOGLE_CLIENT_ID: 554949767682-oqvvbc2a3klc1tedqvbdotmg4uqkj5s3.apps.googleusercontent.com
        # Apple Sign In (web): same Services ID as prod, staging return URL. The
        # Services ID lt.souply.web must list this return URL + domain in the
        # Apple Developer portal or the popup errors.
        VITE_APPLE_SERVICES_ID: lt.souply.web
        VITE_APPLE_REDIRECT_URI: https://souply.manofoto.dpdns.org/auth/callback
        VITE_APP_ENV: staging
        # NO VITE_ENABLE_DEV_AUTH / dev-user — staging now mirrors prod auth.
    image: souply-web:staging
    container_name: souply-web-staging
    restart: unless-stopped
    ports:
      - "8086:80"
    environment:
      SSR_API_URL: http://192.168.1.212:3002          # staging souply-api (internal)
      PUBLIC_ORIGIN: https://souply.manofoto.dpdns.org
      OG_FALLBACK_IMAGE: https://souply.manofoto.dpdns.org/og-default.png
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:80/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

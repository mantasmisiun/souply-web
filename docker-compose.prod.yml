# PRODUCTION souply-web → :8085 → souply.lt (api.souply.lt, souply-api:3001).
#
# Built from the `main` worktree on OMV. Image tag: souply-web:prod.
#
#   cd /opt/souply/souply-web          # main checkout
#   docker compose -f docker-compose.prod.yml up -d --build
name: souply-prod
services:
  souply-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: https://api.souply.lt
        VITE_GOOGLE_CLIENT_ID: 554949767682-oqvvbc2a3klc1tedqvbdotmg4uqkj5s3.apps.googleusercontent.com
        VITE_APP_ENV: prod
        # NO dev-auth args — prod must not ship the bypass (tree-shaken away).
    image: souply-web:prod
    container_name: souply-web-prod
    restart: unless-stopped
    ports:
      - "8085:80"
    environment:
      SSR_API_URL: http://192.168.1.212:3001          # prod souply-api (internal)
      PUBLIC_ORIGIN: https://souply.lt
      OG_FALLBACK_IMAGE: https://souply.lt/og-default.png
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:80/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

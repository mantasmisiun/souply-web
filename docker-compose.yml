# docker-compose for souply-web on OMV (/opt/souply/souply-web).
#
# TWO environments off one image, parametrised by build args + runtime env:
#
#   souply-web          PROD     → :8085 → souply.lt          (api.souply.lt,        souply-api:3001)
#   souply-web-staging  STAGING  → :8086 → souply.manofoto…   (api.souply.manofoto,  souply-api:3002)
#
# Build context is this dir (no ../shared dependency).
#   docker compose build
#   docker compose up -d
#
# Deploy discipline: push a change to STAGING (manofoto), verify, then
# rebuild PROD (souply.lt) from the same source. PROD has NO dev-auth
# bypass (VITE_ENABLE_DEV_AUTH omitted → tree-shaken); staging keeps it.
#
# BUILD-time (baked into the bundle): VITE_API_BASE_URL, VITE_GOOGLE_CLIENT_ID,
#   and the dev-auth args. RUNTIME (server/index.js): SSR_API_URL (internal,
#   for the /t/:slug prerender), PUBLIC_ORIGIN, OG_FALLBACK_IMAGE.

services:
  # ── PRODUCTION ─────────────────────────────────────────────────
  souply-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: https://api.souply.lt
        VITE_GOOGLE_CLIENT_ID: 554949767682-oqvvbc2a3klc1tedqvbdotmg4uqkj5s3.apps.googleusercontent.com
        # NO VITE_ENABLE_DEV_AUTH / dev-user here on purpose — prod must
        # not ship the bypass (it tree-shakes away when the flag is unset).
    container_name: souply-web
    restart: unless-stopped
    ports:
      - "8085:80"
    environment:
      SSR_API_URL: http://192.168.1.212:3001          # prod souply-api (internal)
      PUBLIC_ORIGIN: https://souply.lt
      OG_FALLBACK_IMAGE: https://souply.lt/og-default.png
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:80/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── STAGING ────────────────────────────────────────────────────
  souply-web-staging:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: https://api.souply.manofoto.dpdns.org
        VITE_GOOGLE_CLIENT_ID: 554949767682-oqvvbc2a3klc1tedqvbdotmg4uqkj5s3.apps.googleusercontent.com
        # Staging keeps the gated dev-auth bypass for testing.
        VITE_ENABLE_DEV_AUTH: "1"
        VITE_DEV_USER_ID: 00000000-0000-0000-0000-000000000000
        VITE_DEV_USER_NAME: Mantas Misiūnas
        VITE_DEV_USER_HANDLE: mantasm
    container_name: souply-web-staging
    restart: unless-stopped
    ports:
      - "8086:80"
    environment:
      SSR_API_URL: http://192.168.1.212:3002          # staging souply-api (internal)
      PUBLIC_ORIGIN: https://souply.manofoto.dpdns.org
      OG_FALLBACK_IMAGE: https://souply.manofoto.dpdns.org/og-default.png
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:80/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
